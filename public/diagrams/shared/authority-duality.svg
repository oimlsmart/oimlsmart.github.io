<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">The authority duality: one committee, two co-authoritative forms, one audit</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrBrand" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- the committee (the sole source of authority) -->
  <rect x="330" y="60" width="240" height="76" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">The committee in charge</text>
  <text x="450" y="110" text-anchor="middle" font-size="12" fill="#475569">62-member-body governance;</text>
  <text x="450" y="126" text-anchor="middle" font-size="12" fill="#475569">no special seat for anyone</text>

  <!-- the two co-authoritative forms -->
  <rect x="90" y="200" width="270" height="104" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="225" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">The text</text>
  <text x="225" y="252" text-anchor="middle" font-size="12" fill="#475569">the published Recommendation</text>
  <text x="225" y="270" text-anchor="middle" font-size="12" fill="#475569">+ the .prd clause fragments</text>
  <text x="225" y="288" text-anchor="middle" font-size="12" fill="#475569">(addressed, normativity-marked)</text>

  <rect x="540" y="200" width="270" height="104" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="675" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">The SMART model</text>
  <text x="675" y="252" text-anchor="middle" font-size="12" fill="#475569">the Primmel package</text>
  <text x="675" y="270" text-anchor="middle" font-size="12" fill="#475569">+ its generated data tree,</text>
  <text x="675" y="288" text-anchor="middle" font-size="12" fill="#475569">executable truth</text>

  <!-- committee publishes both forms (neither arrow is primary) -->
  <line x1="390" y1="136" x2="255" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="162" text-anchor="middle" font-size="11" fill="#64748b">publishes</text>
  <line x1="510" y1="136" x2="645" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="610" y="162" text-anchor="middle" font-size="11" fill="#64748b">publishes</text>

  <!-- the congruence matrix: both directions -->
  <rect x="230" y="348" width="440" height="66" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450" y="374" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">The congruence matrix (generated at build)</text>
  <text x="450" y="396" text-anchor="middle" font-size="12" fill="#475569">clause → model nodes (or a recorded committee-pending decision) · model node → clause anchors</text>

  <line x1="225" y1="304" x2="350" y2="344" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrBrand)"/>
  <text x="240" y="330" text-anchor="middle" font-size="11" fill="#1d4ed8">forward</text>
  <line x1="675" y1="304" x2="550" y2="344" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrBrand)"/>
  <text x="660" y="330" text-anchor="middle" font-size="11" fill="#1d4ed8">reverse</text>

  <!-- the gate -->
  <rect x="245" y="428" width="410" height="26" rx="13" fill="#1e293b"/>
  <text x="450" y="445" text-anchor="middle" font-size="11" fill="#f8fafc">npm run test:congruence-matrix: drift in either direction fails the build</text>
</svg>
