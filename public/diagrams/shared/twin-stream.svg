<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#1e293b">The twin stream — model → stream → register → verdict</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- The chain -->
  <rect x="24" y="58" width="168" height="70" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="108" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">the model's serves</text>
  <text x="108" y="96" text-anchor="middle" font-size="9" fill="#15803d">twin.prl: registers +</text>
  <text x="108" y="108" text-anchor="middle" font-size="9" fill="#15803d">fresh_within + watches</text>

  <rect x="222" y="58" width="150" height="70" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="297" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">the TwinContract</text>
  <text x="297" y="96" text-anchor="middle" font-size="9" fill="#15803d">serve targets +</text>
  <text x="297" y="108" text-anchor="middle" font-size="9" fill="#15803d">freshWithinS</text>

  <rect x="402" y="58" width="180" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="492" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">GET /twin/stream</text>
  <text x="492" y="96" text-anchor="middle" font-size="9" fill="#3b82f6">snapshot + one frame</text>
  <text x="492" y="108" text-anchor="middle" font-size="9" fill="#3b82f6">per clock advance</text>

  <rect x="612" y="58" width="222" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="723" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">the twin_stream connector</text>
  <text x="723" y="96" text-anchor="middle" font-size="9" fill="#3b82f6">per-operation streams · unwrap →</text>
  <text x="723" y="108" anchor="middle" font-size="9" fill="#3b82f6">register (receipt-stamped)</text>

  <line x1="192" y1="93" x2="214" y2="93" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="372" y1="93" x2="394" y2="93" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="582" y1="93" x2="604" y2="93" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Frame anatomy -->
  <rect x="24" y="168" width="380" height="220" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="214" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">the frame (SSE, event: twin)</text>
  <rect x="44" y="206" width="340" height="162" rx="8" fill="#0f172a"/>
  <text x="58" y="228" font-size="10.5" fill="#93c5fd" font-family="ui-monospace, monospace">id: 300</text>
  <text x="58" y="246" font-size="10.5" fill="#93c5fd" font-family="ui-monospace, monospace">event: twin</text>
  <text x="58" y="264" font-size="10.5" fill="#e2e8f0" font-family="ui-monospace, monospace">data: {"timestamp": 300,</text>
  <text x="58" y="282" font-size="10.5" fill="#e2e8f0" font-family="ui-monospace, monospace">       "targets": [</text>
  <text x="58" y="300" font-size="10.5" fill="#e2e8f0" font-family="ui-monospace, monospace">         {"target": "indication", "value": {…}},</text>
  <text x="58" y="318" font-size="10.5" fill="#e2e8f0" font-family="ui-monospace, monospace">         {"target": "state", "value": "ready"}</text>
  <text x="58" y="336" font-size="10.5" fill="#e2e8f0" font-family="ui-monospace, monospace">       ]}</text>
  <text x="58" y="358" font-size="10.5" fill="#64748b" font-family="ui-monospace, monospace">: keepalive</text>

  <!-- Frame facts -->
  <rect x="424" y="168" width="410" height="220" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="629" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">what each piece is (never invented)</text>
  <text x="444" y="220" font-size="10.5" font-weight="700" fill="#1e293b">id + timestamp</text>
  <text x="444" y="236" font-size="10" fill="#475569">the instrument clock — manual: boot-seconds; wall: epoch.</text>
  <text x="444" y="250" font-size="10" fill="#475569">The id IS the resumption token (Last-Event-ID).</text>
  <text x="444" y="274" font-size="10.5" font-weight="700" fill="#1e293b">targets[]</text>
  <text x="444" y="290" font-size="10" fill="#475569">exactly the model's declared serves — atomic, clock-aligned:</text>
  <text x="444" y="304" font-size="10" fill="#475569">one frame = every target at one clock instant.</text>
  <text x="444" y="328" font-size="10.5" font-weight="700" fill="#1e293b">snapshot on connect</text>
  <text x="444" y="344" font-size="10" fill="#475569">the current state immediately — no poll needed to start.</text>
  <text x="444" y="368" font-size="10" fill="#475569">heartbeat comments keep proxies from dropping the stream.</text>

  <!-- The three clocks -->
  <rect x="24" y="412" width="380" height="128" rx="12" fill="#fefce8" stroke="#fde047"/>
  <text x="214" y="436" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854d0e">the three clocks (the freshness doctrine)</text>
  <text x="44" y="462" font-size="10" fill="#713f12">1 · the instrument clock — the frame's id/timestamp.</text>
  <text x="44" y="480" font-size="10" fill="#713f12">2 · the receipt clock — the connector stamps at serve-receipt.</text>
  <text x="44" y="498" font-size="10" fill="#713f12">3 · fresh_within — the MODEL's window, carried verbatim;</text>
  <text x="44" y="514" font-size="10" fill="#713f12">    stale ⇒ indeterminate, never fail, never silent pass.</text>

  <!-- Failure taxonomy -->
  <rect x="424" y="412" width="410" height="128" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="629" y="436" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">every failure is honest (never thrown into evidence)</text>
  <text x="444" y="462" font-size="10" fill="#7f1d1d">connect fail · HTTP ≠ 200 (a legacy twin) · malformed frame ·</text>
  <text x="444" y="478" font-size="10" fill="#7f1d1d">missing target (silence is not evidence) · stream end (the feed</text>
  <text x="444" y="494" font-size="10" fill="#7f1d1d">is gone) · no frame yet (an honest absence) — each an</text>
  <text x="444" y="510" font-size="10" fill="#7f1d1d">unavailable with its reason; the health log carries it.</text>
</svg>
