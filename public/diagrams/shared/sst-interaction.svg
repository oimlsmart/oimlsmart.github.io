<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#1e293b">How the model becomes the API — and how a consumer interacts</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- The derivation chain (top) -->
  <rect x="30" y="52" width="150" height="58" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="105" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">the Primmel model</text>
  <text x="105" y="88" text-anchor="middle" font-size="9" fill="#15803d">IS · HAS · DOES</text>
  <text x="105" y="100" text-anchor="middle" font-size="8.5" fill="#16a34a">primmel-packages/ (SSOT)</text>

  <rect x="212" y="52" width="140" height="58" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="282" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">twin.prl</text>
  <text x="282" y="88" text-anchor="middle" font-size="9" fill="#15803d">the governed projection</text>
  <text x="282" y="100" text-anchor="middle" font-size="8.5" fill="#16a34a">serves · fresh_within · scopes</text>

  <rect x="384" y="52" width="140" height="58" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="454" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">the TwinContract</text>
  <text x="454" y="88" text-anchor="middle" font-size="9" fill="#15803d">the sim reads the package</text>
  <text x="454" y="100" text-anchor="middle" font-size="8.5" fill="#16a34a">handshake + startup checks</text>

  <rect x="556" y="52" width="130" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="621" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">the schema</text>
  <text x="621" y="88" text-anchor="middle" font-size="9" fill="#3b82f6">generated, never written</text>
  <text x="621" y="100" text-anchor="middle" font-size="8.5" fill="#3b82f6">drift = boot failure</text>

  <rect x="718" y="52" width="112" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="774" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e40af">the driver</text>
  <text x="774" y="88" text-anchor="middle" font-size="9" fill="#3b82f6">typed methods</text>
  <text x="774" y="100" text-anchor="middle" font-size="8.5" fill="#3b82f6">same contract</text>

  <line x1="180" y1="81" x2="204" y2="81" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="352" y1="81" x2="376" y2="81" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="524" y1="81" x2="548" y2="81" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="686" y1="81" x2="710" y2="81" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Facet → face mapping -->
  <rect x="30" y="134" width="800" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="156" font-size="10.5" font-weight="700" fill="#1e293b">HAS — served register</text>
  <text x="240" y="156" font-size="10" fill="#475569">→ query field  { value, unit, kind, servedAt }</text>
  <text x="46" y="176" font-size="10.5" font-weight="700" fill="#1e293b">HAS — served watch</text>
  <text x="240" y="176" font-size="10" fill="#475569">→ subscription field (GraphQL-over-SSE) + point query</text>
  <text x="46" y="194" font-size="10.5" font-weight="700" fill="#1e293b">DOES — behavior</text>
  <text x="240" y="194" font-size="10" fill="#475569">→ mutation field  →  OpResult { state }   (IS — hierarchy: the contract's scoping, never a wire verb)</text>

  <!-- The consumer -->
  <rect x="30" y="238" width="180" height="290" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="120" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">the consumer</text>
  <text x="120" y="280" text-anchor="middle" font-size="9.5" fill="#64748b">SMART app · monitor · harness</text>
  <rect x="46" y="296" width="148" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="316" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e293b">Twin Lab</text>
  <text x="120" y="330" text-anchor="middle" font-size="9" fill="#64748b">introspects — never assumes</text>
  <rect x="46" y="352" width="148" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="372" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e293b">monitor + gateway</text>
  <text x="120" y="386" text-anchor="middle" font-size="9" fill="#64748b">poll · subscribe · invoke</text>
  <rect x="46" y="408" width="148" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="428" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e293b">harnesses</text>
  <text x="120" y="442" text-anchor="middle" font-size="9" fill="#64748b">vitest · e2e · pilot</text>
  <text x="120" y="492" text-anchor="middle" font-size="9" fill="#94a3b8">no iframe, no bench,</text>
  <text x="120" y="505" text-anchor="middle" font-size="9" fill="#94a3b8">no shared code</text>

  <!-- The twin channel -->
  <rect x="280" y="238" width="240" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="400" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">/twin — the instrument-legal surface</text>
  <text x="400" y="280" text-anchor="middle" font-size="9" fill="#3b82f6">generated from the model · the only channel certification may use</text>
  <text x="296" y="308" font-size="10" font-weight="700" fill="#1e293b">perform action</text>
  <text x="410" y="308" font-size="9.5" fill="#475569">DOES → mutation → OpResult</text>
  <text x="296" y="332" font-size="10" font-weight="700" fill="#1e293b">probe condition</text>
  <text x="410" y="332" font-size="9.5" fill="#475569">HAS → state · environmental_context (+ watch)</text>
  <text x="296" y="356" font-size="10" font-weight="700" fill="#1e293b">read results</text>
  <text x="410" y="356" font-size="9.5" fill="#475569">HAS → served indication registers</text>
  <text x="296" y="380" font-size="10" font-weight="700" fill="#1e293b">trigger modes</text>
  <text x="410" y="380" font-size="9.5" fill="#94a3b8">— absent by thesis (the model declares none)</text>

  <!-- The world channel -->
  <rect x="280" y="416" width="240" height="124" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="400" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">/world — the simulated reality</text>
  <text x="400" y="458" text-anchor="middle" font-size="9" fill="#dc2626">NOT part of the twin contract — harnesses + the declared</text>
  <text x="400" y="470" text-anchor="middle" font-size="9" fill="#dc2626">practice seam only (the epistemic wall, law 1)</text>
  <text x="296" y="494" font-size="10" font-weight="700" fill="#1e293b">perform action</text>
  <text x="410" y="494" font-size="9.5" fill="#475569">kind actuation · setEnvironment · advanceTime</text>
  <text x="296" y="516" font-size="10" font-weight="700" fill="#1e293b">trigger modes</text>
  <text x="410" y="516" font-size="9.5" fill="#475569">setClockMode · scenario · fault · reset · fidelity</text>

  <!-- The instrument -->
  <rect x="620" y="286" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="725" y="312" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">the SST (Simulated SMART Twin)</text>
  <text x="725" y="334" text-anchor="middle" font-size="9.5" fill="#475569">physics stages · scenario registry</text>
  <text x="725" y="350" text-anchor="middle" font-size="9.5" fill="#475569">D 11 environment · virtual clock</text>
  <text x="725" y="374" text-anchor="middle" font-size="9" fill="#94a3b8">base + kind + instance packages</text>
  <text x="725" y="388" text-anchor="middle" font-size="9" fill="#94a3b8">a declared serve it cannot answer</text>
  <text x="725" y="400" text-anchor="middle" font-size="9" fill="#94a3b8">fails the boot (law 2)</text>

  <!-- Flows -->
  <line x1="210" y1="310" x2="272" y2="310" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="241" y="302" text-anchor="middle" font-size="9" fill="#1e40af">POST /twin</text>
  <line x1="272" y1="326" x2="210" y2="326" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="241" y="342" text-anchor="middle" font-size="9" fill="#64748b">served values · OpResult</text>

  <line x1="210" y1="478" x2="272" y2="478" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>
  <text x="241" y="470" text-anchor="middle" font-size="9" fill="#b91c1c">POST /world</text>

  <line x1="520" y1="318" x2="612" y2="340" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="520" y1="478" x2="612" y2="400" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>

  <!-- The wall -->
  <line x1="576" y1="238" x2="576" y2="540" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="586" y="252" font-size="9.5" font-weight="700" fill="#b91c1c">the epistemic wall</text>
  <text x="586" y="265" font-size="8.5" fill="#dc2626">certification software never</text>
  <text x="586" y="276" font-size="8.5" fill="#dc2626">calls /world for evidence</text>
</svg>
