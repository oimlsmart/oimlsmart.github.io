<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The state graph of the OIML-CS certification chain as implemented: seven declared state machines (application, sample, test request, test run, test report, evaluation report, certificate), each walking its happy path left to right, with the cross-machine bridges that open the next machine drawn as vertical links.</title>
  <defs>
    <marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="st-bridge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#ffffff"/>

  <!-- Row template per machine: label at left, states as chips with arrows. -->

  <!-- 1. application -->
  <text x="20" y="44" font-size="12.5" font-weight="700" fill="#0f172a">Application</text>
  <text x="20" y="60" font-size="10" fill="#64748b">the wizard; the review queue</text>
  <g font-size="10.5" font-weight="600">
    <rect x="200" y="30" width="92" height="26" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="246" y="47" text-anchor="middle" fill="#1e3a8a">SUBMITTED</text>
    <line x1="292" y1="43" x2="306" y2="43" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="308" y="30" width="150" height="26" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="383" y="47" text-anchor="middle" fill="#1e3a8a">SAMPLES_REQUESTED</text>
    <line x1="458" y1="43" x2="472" y2="43" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="474" y="30" width="140" height="26" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="544" y="47" text-anchor="middle" fill="#1e3a8a">SAMPLES_RECEIVED</text>
    <line x1="614" y1="43" x2="628" y2="43" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="630" y="30" width="118" height="26" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="689" y="47" text-anchor="middle" fill="#1e3a8a">UNDER_REVIEW</text>
    <line x1="748" y1="43" x2="762" y2="43" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="764" y="30" width="90" height="26" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="809" y="47" text-anchor="middle" fill="#14532d">ACCEPTED</text>
    <rect x="880" y="30" width="180" height="26" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="970" y="47" text-anchor="middle" fill="#7f1d1d">REJECTED / WITHDRAWN</text>
    <text x="200" y="76" font-size="9.5" font-weight="400" fill="#64748b">CHANGES_REQUESTED re-opens the wizard for edit-and-resubmit</text>
  </g>
  <!-- bridge: accept creates the TEP + the DRAFT evaluation report -->
  <line x1="809" y1="56" x2="809" y2="86" stroke="#16a34a" stroke-width="1.6" marker-end="url(#st-bridge)"/>
  <text x="818" y="72" font-size="9.5" fill="#166534">accept creates the Type Evaluation Project</text>
  <text x="818" y="84" font-size="9.5" fill="#166534">(the DRAFT evaluation report is its artifact)</text>

  <!-- 2. sample -->
  <text x="20" y="124" font-size="12.5" font-weight="700" fill="#0f172a">Sample</text>
  <text x="20" y="140" font-size="10" fill="#64748b">one per physical instrument</text>
  <g font-size="10.5" font-weight="600">
    <rect x="200" y="110" width="96" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="248" y="127" text-anchor="middle" fill="#0f172a">REQUESTED</text>
    <line x1="296" y1="123" x2="310" y2="123" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="312" y="110" width="96" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="360" y="127" text-anchor="middle" fill="#0f172a">IN_TRANSIT</text>
    <line x1="408" y1="123" x2="422" y2="123" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="424" y="110" width="88" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="468" y="127" text-anchor="middle" fill="#0f172a">RECEIVED</text>
    <line x1="512" y1="123" x2="526" y2="123" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="528" y="110" width="100" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="578" y="127" text-anchor="middle" fill="#0f172a">IN_TESTING</text>
    <line x1="628" y1="123" x2="642" y2="123" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="644" y="110" width="150" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="719" y="127" text-anchor="middle" fill="#0f172a">TESTING_COMPLETE</text>
    <text x="200" y="156" font-size="9.5" font-weight="400" fill="#64748b">IN_TRANSIT ⇄ RECEIVED per custody leg (applicant → IA → laboratory); the IA selects the evaluated subset (R 60-3, 4.7)</text>
  </g>

  <!-- 3. test request -->
  <text x="20" y="204" font-size="12.5" font-weight="700" fill="#0f172a">TestRequest</text>
  <text x="20" y="220" font-size="10" fill="#64748b">one per laboratory</text>
  <g font-size="10.5" font-weight="600">
    <rect x="200" y="190" width="76" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="238" y="207" text-anchor="middle" fill="#0f172a">ISSUED</text>
    <line x1="276" y1="203" x2="290" y2="203" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="292" y="190" width="150" height="26" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="367" y="207" text-anchor="middle" fill="#78350f">ACCEPTED_BY_LAB</text>
    <line x1="442" y1="203" x2="456" y2="203" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="458" y="190" width="106" height="26" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="511" y="207" text-anchor="middle" fill="#78350f">IN_PROGRESS</text>
    <line x1="564" y1="203" x2="578" y2="203" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="580" y="190" width="98" height="26" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="629" y="207" text-anchor="middle" fill="#78350f">COMPLETED</text>
    <rect x="704" y="190" width="150" height="26" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="779" y="207" text-anchor="middle" fill="#7f1d1d">REJECTED_BY_LAB</text>
  </g>

  <!-- 4. test run -->
  <text x="20" y="284" font-size="12.5" font-weight="700" fill="#0f172a">TestRun</text>
  <text x="20" y="300" font-size="10" fill="#64748b">one per assignment</text>
  <g font-size="10.5" font-weight="600">
    <rect x="200" y="270" width="84" height="26" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="242" y="287" text-anchor="middle" fill="#78350f">PLANNED</text>
    <line x1="284" y1="283" x2="298" y2="283" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="300" y="270" width="106" height="26" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="353" y="287" text-anchor="middle" fill="#78350f">IN_PROGRESS</text>
    <line x1="406" y1="283" x2="420" y2="283" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="422" y="270" width="98" height="26" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="471" y="287" text-anchor="middle" fill="#14532d">COMPLETED</text>
    <rect x="546" y="270" width="120" height="26" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="606" y="287" text-anchor="middle" fill="#7f1d1d">INVALIDATED</text>
    <text x="200" y="316" font-size="9.5" font-weight="400" fill="#64748b">the admissibility gate (evidence, units, the setup constraints, the test-sequence gate) decides COMPLETED vs INVALIDATED; INVALIDATED re-opens as PLANNED (redo)</text>
  </g>
  <!-- bridge: run completion feeds the test report -->
  <line x1="471" y1="296" x2="471" y2="346" stroke="#16a34a" stroke-width="1.6" marker-end="url(#st-bridge)"/>
  <text x="480" y="330" font-size="9.5" fill="#166534">the completed run's form instance is the report's evidence (test_report_id, backfilled for the draft-first order)</text>

  <!-- 5. test report -->
  <text x="20" y="364" font-size="12.5" font-weight="700" fill="#0f172a">TestReport</text>
  <text x="20" y="380" font-size="10" fill="#64748b">per laboratory request</text>
  <g font-size="10.5" font-weight="600">
    <rect x="200" y="350" width="76" height="26" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="238" y="367" text-anchor="middle" fill="#78350f">DRAFT</text>
    <line x1="276" y1="363" x2="290" y2="363" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="292" y="350" width="96" height="26" rx="8" fill="#fffbeb" stroke="#d97706"/><text x="340" y="367" text-anchor="middle" fill="#78350f">SUBMITTED</text>
    <line x1="388" y1="363" x2="402" y2="363" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="404" y="350" width="124" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="466" y="367" text-anchor="middle" fill="#0f172a">UNDER_REVIEW</text>
    <line x1="528" y1="363" x2="542" y2="363" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="544" y="350" width="92" height="26" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="590" y="367" text-anchor="middle" fill="#14532d">ACCEPTED</text>
    <rect x="662" y="350" width="88" height="26" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="706" y="367" text-anchor="middle" fill="#7f1d1d">REJECTED</text>
    <text x="200" y="396" font-size="9.5" font-weight="400" fill="#64748b">the signature acknowledgment pins the signature slot before SUBMITTED; the IA's per-section verdicts carry the review; SUBMITTED/UNDER_REVIEW re-open to DRAFT</text>
  </g>
  <!-- bridge: the accepted report feeds the evaluation -->
  <line x1="590" y1="376" x2="590" y2="426" stroke="#16a34a" stroke-width="1.6" marker-end="url(#st-bridge)"/>
  <text x="599" y="406" font-size="9.5" fill="#166534">the ACCEPTED determination folds the section verdicts</text>
  <text x="599" y="418" font-size="9.5" fill="#166534">into the evaluation's synopsis (R 60-3, 4.2-4.3)</text>

  <!-- 6. evaluation report -->
  <text x="20" y="444" font-size="12.5" font-weight="700" fill="#0f172a">EvaluationReport</text>
  <text x="20" y="460" font-size="10" fill="#64748b">the IA's examinations + the TRs</text>
  <g font-size="10.5" font-weight="600">
    <rect x="200" y="430" width="76" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="238" y="447" text-anchor="middle" fill="#0f172a">DRAFT</text>
    <line x1="276" y1="443" x2="290" y2="443" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="292" y="430" width="92" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="338" y="447" text-anchor="middle" fill="#0f172a">IN_REVIEW</text>
    <line x1="384" y1="443" x2="398" y2="443" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="400" y="430" width="140" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="470" y="447" text-anchor="middle" fill="#0f172a">ALL_TR_REVIEWED</text>
    <line x1="540" y1="443" x2="554" y2="443" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="556" y="430" width="92" height="26" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="602" y="447" text-anchor="middle" fill="#14532d">APPROVED</text>
    <rect x="656" y="430" width="200" height="26" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="756" y="447" text-anchor="middle" fill="#14532d">CONDITIONALLY_APPROVED</text>
    <rect x="864" y="430" width="88" height="26" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="908" y="447" text-anchor="middle" fill="#7f1d1d">REJECTED</text>
    <text x="200" y="476" font-size="9.5" font-weight="400" fill="#64748b">finalize walks the machine with the IA's verdict + rationale; the re-executed requirement verdicts are the arithmetic authority behind the suggestion</text>
  </g>
  <!-- bridge: the approved terminal unlocks issuance -->
  <line x1="602" y1="456" x2="602" y2="506" stroke="#16a34a" stroke-width="1.6" marker-end="url(#st-bridge)"/>
  <text x="611" y="486" font-size="9.5" fill="#166534">APPROVED / CONDITIONALLY_APPROVED unlocks issuance</text>
  <text x="611" y="498" font-size="9.5" fill="#166534">(the PD-08 declaration gate applies)</text>

  <!-- 7. certificate -->
  <text x="20" y="524" font-size="12.5" font-weight="700" fill="#0f172a">Certificate</text>
  <text x="20" y="540" font-size="10" fill="#64748b">CNML-signed at issue</text>
  <g font-size="10.5" font-weight="600">
    <rect x="200" y="510" width="76" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="238" y="527" text-anchor="middle" fill="#0f172a">DRAFT</text>
    <line x1="276" y1="523" x2="290" y2="523" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="292" y="510" width="190" height="26" rx="8" fill="#faf5ff" stroke="#9333ea"/><text x="387" y="527" text-anchor="middle" fill="#581c87">PENDING_REGISTRATION</text>
    <line x1="482" y1="523" x2="496" y2="523" stroke="#475569" stroke-width="1.4" marker-end="url(#st-arrow)"/>
    <rect x="498" y="510" width="76" height="26" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="536" y="527" text-anchor="middle" fill="#14532d">ACTIVE</text>
    <rect x="600" y="510" width="320" height="26" rx="8" fill="#f8fafc" stroke="#334155"/><text x="760" y="527" text-anchor="middle" fill="#334155">EXPIRED / SUSPENDED ⇄ ACTIVE / UNDER_INVESTIGATION / WITHDRAWN</text>
    <text x="200" y="556" font-size="9.5" font-weight="400" fill="#64748b">"Register with BIML" walks DRAFT → PENDING_REGISTRATION; the BIML officer's act publishes ACTIVE with the registration number; the public register and the applicant portal read it</text>
  </g>

  <text x="20" y="610" font-size="11" font-weight="600" fill="#475569">Green frames: the chain's forward terminals. Red frames: the closing alternatives. Every transition writes an audit event; every machine is declared in data/core/evaluation/state-machines.yaml.</text>
</svg>
