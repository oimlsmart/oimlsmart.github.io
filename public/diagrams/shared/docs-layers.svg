<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="700" height="480" fill="#ffffff"/>
  <text x="350" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">The documentation, in layers</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <circle cx="350" cy="250" r="70" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="350" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Layer 0</text>
  <text x="350" y="266" text-anchor="middle" font-size="11" fill="#475569">the mental model</text>

  <circle cx="350" cy="250" r="120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="350" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Layer 1 — the system map</text>
  <text x="350" y="170" text-anchor="middle" font-size="11" fill="#475569">five repos, one data flow</text>

  <circle cx="350" cy="250" r="170" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="350" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Layer 2 — the components</text>
  <text x="350" y="120" text-anchor="middle" font-size="11" fill="#475569">one page each, same shape</text>

  <circle cx="350" cy="250" r="220" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="350" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Layer 3 — the references</text>
  <text x="350" y="70" text-anchor="middle" font-size="11" fill="#475569">gates map · AGENTS.d · the published volumes</text>

  <line x1="530" y1="400" x2="590" y2="460" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="596" y="440" font-size="11" fill="#64748b">stop at any layer —</text>
  <text x="596" y="456" font-size="11" fill="#64748b">each is complete for its depth</text>
</svg>
