<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">The five repositories</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="340" y="70" width="220" height="92" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="450" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">primmel-ts</text>
  <text x="450" y="122" text-anchor="middle" font-size="12" fill="#475569">the kernel: parser, linter,</text>
  <text x="450" y="142" text-anchor="middle" font-size="12" fill="#475569">coverage calculus, diff (yarn test)</text>

  <rect x="40" y="210" width="220" height="92" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">sim-instruments</text>
  <text x="150" y="262" text-anchor="middle" font-size="12" fill="#475569">4 simulated instruments</text>
  <text x="150" y="282" text-anchor="middle" font-size="12" fill="#475569">/twin + /world (npm test)</text>

  <rect x="340" y="210" width="220" height="92" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">smart</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#475569">the platform: packages (SSOT),</text>
  <text x="450" y="282" text-anchor="middle" font-size="12" fill="#475569">data trees, the browser app</text>

  <rect x="640" y="210" width="220" height="92" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="750" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">primmel-oiml-smart</text>
  <text x="750" y="262" text-anchor="middle" font-size="12" fill="#475569">the published docs site</text>
  <text x="750" y="282" text-anchor="middle" font-size="12" fill="#475569">(volumes, diagrams, the demo manual)</text>

  <rect x="340" y="350" width="220" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">primmel (v2)</text>
  <text x="450" y="402" text-anchor="middle" font-size="12" fill="#475569">the predecessor language</text>

  <line x1="450" y1="162" x2="450" y2="202" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="530" y="186" font-size="11" fill="#64748b">consumed via PRIMMEL_TS (symlink)</text>

  <line x1="260" y1="256" x2="332" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="296" y="245" text-anchor="middle" font-size="11" fill="#64748b">serves twins</text>

  <line x1="560" y1="256" x2="632" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="596" y="245" text-anchor="middle" font-size="11" fill="#64748b">documents</text>

  <line x1="450" y1="302" x2="450" y2="342" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="516" y="326" font-size="11" fill="#64748b">superset of</text>

  <text x="450" y="445" text-anchor="middle" font-size="13" fill="#64748b">The smart repo is the platform; the kernel is its language; the sims are its instruments; the docs site is its voice.</text>
</svg>
