<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">The three layers of the digital twin</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="40" y="70" width="240" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Physical device</text>
  <text x="160" y="126" text-anchor="middle" font-size="12" fill="#475569">the load cell on the bench</text>
  <text x="160" y="146" text-anchor="middle" font-size="12" fill="#475569">strain → voltage → display</text>
  <text x="160" y="166" text-anchor="middle" font-size="11" fill="#94a3b8">truth (unknowable directly)</text>

  <rect x="330" y="70" width="240" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">FULL DIGITAL TWIN</text>
  <text x="450" y="126" text-anchor="middle" font-size="12" fill="#475569">the manufacturer's complete</text>
  <text x="450" y="146" text-anchor="middle" font-size="12" fill="#475569">representation — arbitrarily rich:</text>
  <text x="450" y="166" text-anchor="middle" font-size="12" fill="#475569">physics, telemetry, history, diagnostics</text>

  <rect x="620" y="70" width="240" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="740" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">PRIMMEL TWIN</text>
  <text x="740" y="126" text-anchor="middle" font-size="12" fill="#475569">the governed projection:</text>
  <text x="740" y="146" text-anchor="middle" font-size="12" fill="#475569">only what the standard declares</text>
  <text x="740" y="166" text-anchor="middle" font-size="12" fill="#475569">registers + freshness + provenance</text>

  <line x1="280" y1="125" x2="322" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="301" y="114" text-anchor="middle" font-size="11" fill="#64748b">represents</text>
  <line x1="570" y1="125" x2="612" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="591" y="114" text-anchor="middle" font-size="11" fill="#64748b">projects</text>

  <rect x="40" y="230" width="240" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">TWIN CERTIFICATION</text>
  <text x="160" y="286" text-anchor="middle" font-size="12" fill="#475569">certifies the projection's fidelity:</text>
  <text x="160" y="306" text-anchor="middle" font-size="12" fill="#475569">served ≡ physical within δ + freshness</text>

  <line x1="740" y1="180" x2="740" y2="216" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="740" y1="216" x2="288" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="600" y="216" text-anchor="middle" font-size="11" fill="#64748b">fidelity proof (points + behavior)</text>

  <rect x="330" y="230" width="240" height="100" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="450" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">The governed aspect set</text>
  <text x="450" y="286" text-anchor="middle" font-size="12" fill="#475569">declared in the Recommendation</text>
  <text x="450" y="306" text-anchor="middle" font-size="12" fill="#475569">(oiml-r60/model/twin.prl)</text>

  <line x1="450" y1="230" x2="450" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="250" x2="648" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="610" y="205" text-anchor="middle" font-size="11" fill="#64748b">derives the interface</text>

  <text x="450" y="385" text-anchor="middle" font-size="13" fill="#64748b">The standard declares what it governs — the twin interface is derived, never hand-designed. The full twin's internal richness stays private.</text>
</svg>
