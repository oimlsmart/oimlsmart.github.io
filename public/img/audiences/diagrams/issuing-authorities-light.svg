<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="480" fill="#faf6ee"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#0a1628">The certification arc, as the Issuing Authority runs it</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7a92"/>
    </marker>
  </defs>

  <rect x="30" y="70" width="180" height="76" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="120" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">1 &#183; Review</text>
  <text x="120" y="118" text-anchor="middle" font-size="11" fill="#3a4a63">the queue, oldest first;</text>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#3a4a63">the whole file, one page</text>

  <rect x="240" y="70" width="180" height="76" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="330" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">2 &#183; Samples</text>
  <text x="330" y="118" text-anchor="middle" font-size="11" fill="#3a4a63">request, shipment,</text>
  <text x="330" y="134" text-anchor="middle" font-size="11" fill="#3a4a63">receipt registered</text>

  <rect x="450" y="70" width="180" height="76" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="540" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">3 &#183; Dispatch</text>
  <text x="540" y="118" text-anchor="middle" font-size="11" fill="#3a4a63">test forms &#215; samples</text>
  <text x="540" y="134" text-anchor="middle" font-size="11" fill="#3a4a63">to your laboratories</text>

  <rect x="660" y="70" width="180" height="76" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="750" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">4 &#183; Evaluation</text>
  <text x="750" y="118" text-anchor="middle" font-size="11" fill="#3a4a63">verdicts computed from</text>
  <text x="750" y="134" text-anchor="middle" font-size="11" fill="#3a4a63">the evidence, not re-typed</text>

  <line x1="210" y1="108" x2="232" y2="108" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="108" x2="442" y2="108" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630" y1="108" x2="652" y2="108" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="750" y1="146" x2="750" y2="196" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="660" y="204" width="180" height="76" rx="10" fill="#edf3fb" stroke="#004996" stroke-width="1.5"/>
  <text x="750" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#004996">5 &#183; Issue</text>
  <text x="750" y="252" text-anchor="middle" font-size="11" fill="#3a4a63">sign the CNML certificate</text>
  <text x="750" y="268" text-anchor="middle" font-size="11" fill="#3a4a63">over the verdict chain</text>

  <rect x="450" y="204" width="180" height="76" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="540" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">6 &#183; Register</text>
  <text x="540" y="252" text-anchor="middle" font-size="11" fill="#3a4a63">the BIML registration act</text>
  <text x="540" y="268" text-anchor="middle" font-size="11" fill="#3a4a63">publishes the valid copy</text>

  <rect x="240" y="204" width="180" height="76" rx="10" fill="#e8f1f8" stroke="#024873" stroke-width="1.5"/>
  <text x="330" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#024873">7 &#183; Verified anywhere</text>
  <text x="330" y="252" text-anchor="middle" font-size="11" fill="#3a4a63">number or file, no account,</text>
  <text x="330" y="268" text-anchor="middle" font-size="11" fill="#3a4a63">no phone call to your desk</text>

  <line x1="660" y1="242" x2="638" y2="242" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="242" x2="428" y2="242" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="204" width="180" height="76" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="120" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">Test Laboratory</text>
  <text x="120" y="252" text-anchor="middle" font-size="11" fill="#3a4a63">works the dispatch, returns</text>
  <text x="120" y="268" text-anchor="middle" font-size="11" fill="#3a4a63">the test report as data</text>

  <line x1="540" y1="146" x2="140" y2="196" stroke="#6b7a92" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="180" y1="204" x2="672" y2="150" stroke="#6b7a92" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <rect x="30" y="330" width="810" height="100" rx="10" fill="#fdf6e9" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="360" font-size="14" font-weight="600" fill="#92400e">Your signature, your liability &#8212; unchanged</text>
  <text x="60" y="384" font-size="12" fill="#3a4a63">The platform does digitally what your authority does today: the same review, the same evaluation, the</text>
  <text x="60" y="402" font-size="12" fill="#3a4a63">same decision. What it removes is the transcription and the archaeology &#8212; every verdict shows the</text>
  <text x="60" y="420" font-size="12" fill="#3a4a63">evidence it was computed from, and suspension and withdrawal are first-class lifecycle acts.</text>

  <text x="450" y="464" text-anchor="middle" font-size="13" fill="#6b7a92">One workflow from application to registration &#8212; every stage an act with a record, never an email.</text>
</svg>
