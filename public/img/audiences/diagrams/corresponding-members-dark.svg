<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="480" fill="#0a1628"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#f5efe4">The Corresponding Member&#8217;s position: full hosted access, one honest gap</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8d9bb4"/>
    </marker>
  </defs>

  <rect x="40" y="70" width="250" height="110" rx="10" fill="#13233d" stroke="#1f3357" stroke-width="1.5"/>
  <text x="165" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#f5efe4">CORRESPONDING MEMBER</text>
  <text x="165" y="120" text-anchor="middle" font-size="12" fill="#c2cad8">participates without a vote;</text>
  <text x="165" y="138" text-anchor="middle" font-size="12" fill="#c2cad8">the Convention governs that &#8212;</text>
  <text x="165" y="158" text-anchor="middle" font-size="11" fill="#8d9bb4">the platform serves it, never sells it</text>

  <rect x="360" y="60" width="500" height="54" rx="10" fill="#1a2c47" stroke="#89b4ef" stroke-width="1.5"/>
  <text x="610" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#89b4ef">Every hosted service, today</text>
  <text x="610" y="101" text-anchor="middle" font-size="11" fill="#c2cad8">the OIML-CS SMART Platform &#183; the AI at the member tier &#183; the library &#183; verify &#183; the register</text>

  <rect x="360" y="128" width="500" height="54" rx="10" fill="#13233d" stroke="#1f3357" stroke-width="1.5"/>
  <text x="610" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#f5efe4">Your Associate, rendered as what it is</text>
  <text x="610" y="169" text-anchor="middle" font-size="11" fill="#c2cad8">the designation a registry fact linked to you; its Declaration standing visible, not filed away</text>

  <rect x="360" y="196" width="500" height="54" rx="10" fill="#13233d" stroke="#1f3357" stroke-width="1.5"/>
  <text x="610" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#f5efe4">The same evidence Member States read</text>
  <text x="610" y="237" text-anchor="middle" font-size="11" fill="#c2cad8">the Recommendations as models with clause-level provenance; the register; the verification surface</text>

  <line x1="290" y1="87" x2="352" y2="87" stroke="#8d9bb4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="155" x2="352" y2="155" stroke="#8d9bb4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="223" x2="352" y2="223" stroke="#8d9bb4" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="360" y="290" width="500" height="54" rx="10" fill="#2a2416" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="610" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#fbbf24">The one entitlement that waits for ratification</text>
  <text x="610" y="331" text-anchor="middle" font-size="11" fill="#c2cad8">self-hosting the platform software &#8212; your own instance, your data residency, streaming updates</text>

  <line x1="290" y1="317" x2="352" y2="317" stroke="#8d9bb4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="321" y="307" text-anchor="middle" font-size="11" fill="#8d9bb4">ratify</text>

  <rect x="40" y="290" width="250" height="54" rx="10" fill="#13233d" stroke="#1f3357" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="165" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#f5efe4">MEMBER STATE</text>
  <text x="165" y="330" text-anchor="middle" font-size="11" fill="#c2cad8">the upward step is the OIML&#8217;s own</text>

  <rect x="40" y="390" width="820" height="50" rx="10" fill="#16324a" stroke="#5ba3cc" stroke-width="1.5"/>
  <text x="450" y="412" text-anchor="middle" font-size="12" fill="#5ba3cc">Nothing to run: the hosted path never requires the self-host entitlement. Accounts for your</text>
  <text x="450" y="429" text-anchor="middle" font-size="12" fill="#5ba3cc">personnel, your Associate&#8217;s standing rendered honestly, and every public surface is yours.</text>

  <text x="450" y="464" text-anchor="middle" font-size="13" fill="#8d9bb4">Read access is never a vote; the platform keeps the Convention&#8217;s categories exactly as they are.</text>
</svg>
