<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="480" fill="#0a1628"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#f5efe4">Accepting a certificate: from letterhead trust to verification</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8d9bb4"/>
    </marker>
  </defs>

  <rect x="30" y="80" width="200" height="92" rx="10" fill="#13233d" stroke="#1f3357" stroke-width="1.5"/>
  <text x="130" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#f5efe4">A certificate is presented</text>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#c2cad8">the paper, the PDF, the CNML</text>
  <text x="130" y="144" text-anchor="middle" font-size="11" fill="#c2cad8">file, or the Verifiable</text>
  <text x="130" y="160" text-anchor="middle" font-size="11" fill="#c2cad8">Credential &#8212; any form</text>

  <rect x="270" y="80" width="200" height="92" rx="10" fill="#1a2c47" stroke="#89b4ef" stroke-width="1.5"/>
  <text x="370" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#89b4ef">Verify it yourself</text>
  <text x="370" y="128" text-anchor="middle" font-size="11" fill="#c2cad8">by number against the public</text>
  <text x="370" y="144" text-anchor="middle" font-size="11" fill="#c2cad8">BIML register (B 18 &#167;15.8),</text>
  <text x="370" y="160" text-anchor="middle" font-size="11" fill="#c2cad8">or the file against the DID</text>

  <rect x="510" y="80" width="200" height="92" rx="10" fill="#13233d" stroke="#1f3357" stroke-width="1.5"/>
  <text x="610" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#f5efe4">Read the live status</text>
  <text x="610" y="128" text-anchor="middle" font-size="11" fill="#c2cad8">the W3C status lists answer</text>
  <text x="610" y="144" text-anchor="middle" font-size="11" fill="#c2cad8">revocation and suspension</text>
  <text x="610" y="160" text-anchor="middle" font-size="11" fill="#c2cad8">as of this second</text>

  <rect x="720" y="80" width="150" height="92" rx="10" fill="#16324a" stroke="#5ba3cc" stroke-width="1.5"/>
  <text x="795" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#5ba3cc">Decide</text>
  <text x="795" y="128" text-anchor="middle" font-size="11" fill="#c2cad8">acceptance becomes</text>
  <text x="795" y="144" text-anchor="middle" font-size="11" fill="#c2cad8">verification, not</text>
  <text x="795" y="160" text-anchor="middle" font-size="11" fill="#c2cad8">trust in letterhead</text>

  <line x1="230" y1="126" x2="262" y2="126" stroke="#8d9bb4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="126" x2="502" y2="126" stroke="#8d9bb4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="126" x2="712" y2="126" stroke="#8d9bb4" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="230" width="410" height="100" rx="10" fill="#13233d" stroke="#1f3357" stroke-width="1.5"/>
  <text x="60" y="258" font-size="14" font-weight="600" fill="#f5efe4">Designated under the OIML-CS (Utilizer / Associate)</text>
  <text x="60" y="280" font-size="12" fill="#c2cad8">Your Declaration (PD-08) is a registry fact linked to your designating</text>
  <text x="60" y="298" font-size="12" fill="#c2cad8">member. Your personnel hold accounts against it; the report and</text>
  <text x="60" y="316" font-size="12" fill="#c2cad8">certificate surfaces open per the designation, evidence attached.</text>

  <rect x="470" y="230" width="400" height="100" rx="10" fill="#13233d" stroke="#1f3357" stroke-width="1.5"/>
  <text x="500" y="258" font-size="14" font-weight="600" fill="#f5efe4">Your national requirements, declared</text>
  <text x="500" y="280" font-size="12" fill="#c2cad8">Additional National Requirements are declared per Recommendation</text>
  <text x="500" y="298" font-size="12" fill="#c2cad8">and market, moderated by the CS registry &#8212; applicants targeting</text>
  <text x="500" y="316" font-size="12" fill="#c2cad8">your market see them before they apply, not after.</text>

  <rect x="30" y="360" width="840" height="70" rx="10" fill="#2a2416" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="60" y="386" font-size="14" font-weight="600" fill="#fbbf24">On the roadmap (SMART+): the instruments you run</text>
  <text x="60" y="410" font-size="12" fill="#c2cad8">A SMART-twin-capable instrument serves its governed aspects live &#8212; compliance becomes a stream you read, not a sticker you trust. See the roadmap section below.</text>

  <text x="450" y="464" text-anchor="middle" font-size="13" fill="#8d9bb4">Every verification is one lookup against the registered copy &#8212; no account, no phone call, no doubt.</text>
</svg>
