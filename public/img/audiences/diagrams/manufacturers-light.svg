<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="480" fill="#faf6ee"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#0a1628">The applicant&#8217;s journey: apply once, follow it live, hold the proof</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7a92"/>
    </marker>
  </defs>

  <rect x="40" y="80" width="190" height="92" rx="10" fill="#edf3fb" stroke="#004996" stroke-width="1.5"/>
  <text x="135" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#004996">Apply</text>
  <text x="135" y="128" text-anchor="middle" font-size="11" fill="#3a4a63">the six-step wizard derives</text>
  <text x="135" y="144" text-anchor="middle" font-size="11" fill="#3a4a63">the instrument form from</text>
  <text x="135" y="160" text-anchor="middle" font-size="11" fill="#3a4a63">the Recommendation&#8217;s model</text>

  <rect x="270" y="80" width="190" height="92" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="365" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#0a1628">Follow it live</text>
  <text x="365" y="128" text-anchor="middle" font-size="11" fill="#3a4a63">review &#183; samples &#183; dispatch</text>
  <text x="365" y="144" text-anchor="middle" font-size="11" fill="#3a4a63">&#183; testing &#183; evaluation &#183;</text>
  <text x="365" y="160" text-anchor="middle" font-size="11" fill="#3a4a63">decision &#8212; each stage visible</text>

  <rect x="500" y="80" width="190" height="92" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="595" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#0a1628">Receive</text>
  <text x="595" y="128" text-anchor="middle" font-size="11" fill="#3a4a63">the certificate as signed CNML,</text>
  <text x="595" y="144" text-anchor="middle" font-size="11" fill="#3a4a63">as a Verifiable Credential,</text>
  <text x="595" y="160" text-anchor="middle" font-size="11" fill="#3a4a63">as an AAS submodel</text>

  <rect x="720" y="80" width="150" height="92" rx="10" fill="#e8f1f8" stroke="#024873" stroke-width="1.5"/>
  <text x="795" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#024873">Prove</text>
  <text x="795" y="128" text-anchor="middle" font-size="11" fill="#3a4a63">any customer or</text>
  <text x="795" y="144" text-anchor="middle" font-size="11" fill="#3a4a63">authority verifies it,</text>
  <text x="795" y="160" text-anchor="middle" font-size="11" fill="#3a4a63">no account needed</text>

  <line x1="230" y1="126" x2="262" y2="126" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="126" x2="492" y2="126" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="690" y1="126" x2="712" y2="126" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="230" width="400" height="96" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="70" y="258" font-size="14" font-weight="600" fill="#0a1628">The promise set</text>
  <text x="70" y="280" font-size="12" fill="#3a4a63">Your declared scope reads as claims, each carrying its</text>
  <text x="70" y="298" font-size="12" fill="#3a4a63">verification status from the evaluation&#8217;s verdicts &#8212;</text>
  <text x="70" y="316" font-size="12" fill="#3a4a63">an unlinked claim is never silently &#8220;verified&#8221;.</text>

  <rect x="470" y="230" width="400" height="96" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="500" y="258" font-size="14" font-weight="600" fill="#0a1628">Variants share the spine</text>
  <text x="500" y="280" font-size="12" fill="#3a4a63">A family member or variant reuses the model&#8217;s common</text>
  <text x="500" y="298" font-size="12" fill="#3a4a63">spine instead of re-opening the whole file &#8212; the delta</text>
  <text x="500" y="316" font-size="12" fill="#3a4a63">is what gets evaluated.</text>

  <rect x="40" y="356" width="830" height="76" rx="10" fill="#fdf6e9" stroke="#d97706" stroke-width="1.5"/>
  <text x="70" y="384" font-size="14" font-weight="600" fill="#92400e">On the roadmap (SMART+): the shipped twin</text>
  <text x="70" y="408" font-size="12" fill="#3a4a63">Your instrument serves its governed aspects live, and conformity becomes continuous between</text>
  <text x="70" y="424" font-size="12" fill="#3a4a63">assessments &#8212; certified faithful by the twin-certification program. See the roadmap section below.</text>

  <text x="450" y="464" text-anchor="middle" font-size="13" fill="#6b7a92">One application, watched live to the decision &#8212; and a certificate that keeps answering for you.</text>
</svg>
