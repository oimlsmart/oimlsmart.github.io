<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="480" fill="#faf6ee"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#0a1628">Accepting a certificate: from letterhead trust to verification</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7a92"/>
    </marker>
  </defs>

  <rect x="30" y="80" width="200" height="92" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="130" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">A certificate is presented</text>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#3a4a63">the paper, the PDF, the CNML</text>
  <text x="130" y="144" text-anchor="middle" font-size="11" fill="#3a4a63">file, or the Verifiable</text>
  <text x="130" y="160" text-anchor="middle" font-size="11" fill="#3a4a63">Credential &#8212; any form</text>

  <rect x="270" y="80" width="200" height="92" rx="10" fill="#edf3fb" stroke="#004996" stroke-width="1.5"/>
  <text x="370" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#004996">Verify it yourself</text>
  <text x="370" y="128" text-anchor="middle" font-size="11" fill="#3a4a63">by number against the public</text>
  <text x="370" y="144" text-anchor="middle" font-size="11" fill="#3a4a63">BIML register (B 18 &#167;15.8),</text>
  <text x="370" y="160" text-anchor="middle" font-size="11" fill="#3a4a63">or the file against the DID</text>

  <rect x="510" y="80" width="200" height="92" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="610" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#0a1628">Read the live status</text>
  <text x="610" y="128" text-anchor="middle" font-size="11" fill="#3a4a63">the W3C status lists answer</text>
  <text x="610" y="144" text-anchor="middle" font-size="11" fill="#3a4a63">revocation and suspension</text>
  <text x="610" y="160" text-anchor="middle" font-size="11" fill="#3a4a63">as of this second</text>

  <rect x="720" y="80" width="150" height="92" rx="10" fill="#e8f1f8" stroke="#024873" stroke-width="1.5"/>
  <text x="795" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#024873">Decide</text>
  <text x="795" y="128" text-anchor="middle" font-size="11" fill="#3a4a63">acceptance becomes</text>
  <text x="795" y="144" text-anchor="middle" font-size="11" fill="#3a4a63">verification, not</text>
  <text x="795" y="160" text-anchor="middle" font-size="11" fill="#3a4a63">trust in letterhead</text>

  <line x1="230" y1="126" x2="262" y2="126" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="126" x2="502" y2="126" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="126" x2="712" y2="126" stroke="#6b7a92" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="230" width="410" height="100" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="60" y="258" font-size="14" font-weight="600" fill="#0a1628">Designated under the OIML-CS (Utilizer / Associate)</text>
  <text x="60" y="280" font-size="12" fill="#3a4a63">Your Declaration (PD-08) is a registry fact linked to your designating</text>
  <text x="60" y="298" font-size="12" fill="#3a4a63">member. Your personnel hold accounts against it; the report and</text>
  <text x="60" y="316" font-size="12" fill="#3a4a63">certificate surfaces open per the designation, evidence attached.</text>

  <rect x="470" y="230" width="400" height="100" rx="10" fill="#ffffff" stroke="#ddd2bd" stroke-width="1.5"/>
  <text x="500" y="258" font-size="14" font-weight="600" fill="#0a1628">Your national requirements, declared</text>
  <text x="500" y="280" font-size="12" fill="#3a4a63">Additional National Requirements are declared per Recommendation</text>
  <text x="500" y="298" font-size="12" fill="#3a4a63">and market, moderated by the CS registry &#8212; applicants targeting</text>
  <text x="500" y="316" font-size="12" fill="#3a4a63">your market see them before they apply, not after.</text>

  <rect x="30" y="360" width="840" height="70" rx="10" fill="#fdf6e9" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="386" font-size="14" font-weight="600" fill="#92400e">On the roadmap (SMART+): the instruments you run</text>
  <text x="60" y="410" font-size="12" fill="#3a4a63">A SMART-twin-capable instrument serves its governed aspects live &#8212; compliance becomes a stream you read, not a sticker you trust. See the roadmap section below.</text>

  <text x="450" y="464" text-anchor="middle" font-size="13" fill="#6b7a92">Every verification is one lookup against the registered copy &#8212; no account, no phone call, no doubt.</text>
</svg>
