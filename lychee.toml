# Lychee link checker configuration
# https://lychee.link.cli.rs/

# Accept 200..399 status codes as valid (including redirects)
accept = ["100", "200", "201", "202", "203", "204", "206", "207", "301", "302", "303", "304", "307", "308"]

# Exclude these patterns from checking.
#
# NOTE: we do NOT set `base_url` here. Doing so makes lychee resolve every
# absolute path against the live site, which 404s on the build-specific
# hashed assets under `/_astro/*` (their hashes change per build).
# Instead, sibling-Pages-site URLs (/vocab/, /resolutions/) are excluded
# from the local-build check and verified separately against the live
# site by the `Verify sibling GitHub Pages sites are live` step in
# `.github/workflows/links.yml`.
exclude = [
  # The OIML parent organization's site predates the program's own link
  # hygiene (attribution + prose links); excluded from the per-push sweep.
  "https://www.oiml.org",
  # The trust-registry page cites the registry's honest refusal as
  # evidence: the 404 IS the answer being demonstrated (an unregistered
  # organization is refused with a named error).
  "https://id.oimlsmart.org/op/keys/no-such-organization.json",
  # Sibling GitHub Pages sites on the same domain — checked live by CI.
  # (The /resolutions pattern also covers /resolutions/en/, the language
  # root the nav points at since the minisite's own root became a
  # language-redirect stub.)
  "/vocab",
  "/vocab/",
  "/resolutions",
  "/resolutions/",
  "/publications",
  "/publications/",
  "/certificates",
  "/certificates/",
  # The component repos' minisites — served by their own Pages sites
  # (TODO.components); the top site releases these paths deliberately.
  "/recs",
  "/recs/",
  "/studio",
  "/studio/",
  "/smi",
  "/smi/",
  "/sst",
  "/sst/",
  "/cnml",
  "/cnml/",
  # Cross-app nav target — served by the smart repo's authenticated
  # browser app, not deployable from here.
  "/concepts-management",
  "/concepts-management/",
  # Source repos are private during the pilot — links are for reference,
  # not public, so an unauthenticated 404 proves nothing.
  "https://github.com/oimlsmart/primmel-packages",
]

# Don't check mailto links
include_mail = false

# Maximum number of retries before a link is reported as failed
max_retries = 2

# Number of threads to use
max_concurrency = 16

# Request timeout (seconds)
timeout = 20

# User agent to send
user_agent = "oimlsmart-link-checker"

# Cache results
cache = true

# Max cache age (days)
max_cache_age = "1d"